<!DOCTYPE html>
<html>
<head>
  <title>Loading Volunteer Portal...</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    body { font-family: sans-serif; text-align: center; padding: 100px 20px; }
    .spinner { border: 4px solid rgba(29, 104, 76, 0.15); border-top: 4px solid #1d684c; border-radius: 50%;
               width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 20px auto; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <h2>Waking up the volunteer portal...</h2>
  <p>This can take up to a minute on first load — thanks for your patience!</p>
  <div class="spinner"></div>
  <noscript><p><a href="https://volunteer-application-portal.onrender.com">Click here if you're not redirected</a></p></noscript>

  <script>
    const targetUrl = "https://volunteer-application-portal.onrender.com";
    let redirected = false;

    function goToPortal() {
      if (!redirected) {
        redirected = true;
        window.location.href = targetUrl;
      }
    }

    fetch(targetUrl, { mode: "no-cors" })
      .then(goToPortal)
      .catch(goToPortal);

    setTimeout(goToPortal, 8000);
  </script>
</body>
</html>
